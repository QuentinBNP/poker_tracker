[project]
name = "poker-tracker"
version = "0.1.0"
description = "Personal Winamax poker tracker desktop application"
requires-python = ">=3.12"
dependencies = [
    "watchdog>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]