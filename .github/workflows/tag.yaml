name: Tagged Release

"on":
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify release tag matches project version
        run: python .github/workflows/scripts/verify_release_version.py "${{ github.ref_name }}"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        run: python scripts/build_windows_installer.py

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MyPokerTracker-${{ github.ref_name }}
          path: |
            dist/MyPokerTracker/
            dist/installer/*.exe

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/installer/*.exe